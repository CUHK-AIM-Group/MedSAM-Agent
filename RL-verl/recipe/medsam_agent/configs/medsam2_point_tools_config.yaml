# MedSAM Refinement Tools Configuration - MedSAM2 Version
# Three unified tools for interactive segmentation using MedSAM2:
# 1. add_bbox - add bounding box to initialize mask
# 2. add_point - add positive/negative point to refine mask
# 3. stop_action - signal completion

tools:
  - class_name: "verl.tools.medsam_unified_point_tools.AddBboxTool"
    config:
      num_workers: 32  # Reduced from 64 to avoid overload
      rate_limit: 64   # Reduced from 128 for stability
      timeout: 120     # Increased from 60 for slower operations
      type: native
      # API server URL for MedSAM2
      api_url: "http://localhost:8265"  # Same port as IMISNet (use one at a time)
      max_retries: 3   # Number of retries on connection errors
      retry_delay: 1.0 # Initial delay between retries (exponential backoff)
      model_type: "medsam2"  # Specify model type
    tool_schema:
      type: "function"
      function:
        name: "add_bbox"
        description: "Add a bounding box to initialize or refine the segmentation. The box should roughly cover the target region."
        parameters:
          type: "object"
          properties:
            bbox_2d:
              type: "array"
              items:
                type: "integer"
              minItems: 4
              maxItems: 4
              description: "2D bounding box in [x1, y1, x2, y2] format, with coordinates in range [0, 999]"
          required: ["bbox_2d"]

  - class_name: "verl.tools.medsam_unified_point_tools.AddPointTool"
    config:
      num_workers: 32  # Reduced from 64 to avoid overload
      rate_limit: 64   # Reduced from 128 for stability
      timeout: 120     # Increased from 60 for slower operations
      type: native
      # API server URL for MedSAM2
      api_url: "http://localhost:8265"  # Same port as IMISNet (use one at a time)
      max_retries: 3   # Number of retries on connection errors
      retry_delay: 1.0 # Initial delay between retries (exponential backoff)
      model_type: "medsam2"  # Specify model type
    tool_schema:
      type: "function"
      function:
        name: "add_point"
        description: "Add a point to refine the mask (positive to include areas, negative to exclude areas)."
        parameters:
          type: "object"
          properties:
            point_2d:
              type: "array"
              items:
                type: "integer"
              minItems: 2
              maxItems: 2
              description: "2D coordinate point in [x, y] format, with x and y in range [0, 999]"
            point_type:
              type: "string"
              enum: ["positive", "negative"]
              description: "Type of point: 'positive' to expand mask, 'negative' to refine mask"
          required: ["point_2d", "point_type"]

  - class_name: "verl.tools.medsam_unified_point_tools.StopActionTool"
    config:
      num_workers: 32  # Reduced from 64 to avoid overload
      rate_limit: 64   # Reduced from 128 for stability
      timeout: 120     # Increased from 60 for slower operations
      type: native
      api_url: "http://localhost:8265"  # Same port as IMISNet (use one at a time)
      max_retries: 3   # Number of retries on connection errors
      retry_delay: 1.0 # Initial delay between retries (exponential backoff)
      model_type: "medsam2"  # Specify model type
    tool_schema:
      type: "function"
      function:
        name: "stop_action"
        description: "Stop the refinement process when the mask accurately covers the target object. Use this when you are satisfied with the current mask quality and no further refinement is needed."
        parameters:
          type: "object"
          properties: {}
          required: []
